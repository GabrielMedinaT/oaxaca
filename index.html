<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logoPluma.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" href="/critical.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/critical.css"></noscript>

    <title>Finca Oaxaca – Alojamiento con alma y experiencias únicas</title>
    <meta
      name="description"
      content="Sumérgete en Finca Oaxaca: descanso natural, experiencias auténticas y una conexión íntima con el entorno. Vive momentos inolvidables."
    />
    <meta name="author" content="Finca Oaxaca" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4E3F2D" />

    <!-- Preconnect a GTM (reduce latencia inicial) -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>

    <!-- Preload de la imagen LCP (logo). Sirve AVIF/WebP con fallback -->
    <link rel="preload" as="image"
      href="/assets/logoPluma.avif"
      imagesrcset="/assets/logoPluma.avif type('image/avif'), /assets/logoPluma.webp type('image/webp'), /assets/logoPluma.png type('image/png')"
      imagesizes="(max-width: 768px) 60vw, 600px">

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="Finca Oaxaca – Alojamiento con alma y experiencias únicas"
    />
    <meta
      property="og:description"
      content="Sumérgete en Finca Oaxaca: descanso natural, experiencias auténticas y una conexión íntima con el entorno."
    />
    <meta
      property="og:image"
      content="/src/assets/og-preview.jpg"
    />
    <meta property="og:url" content="https://fincaoaxaca.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Finca Oaxaca – Alojamiento con alma y experiencias únicas"
    />
    <meta
      name="twitter:description"
      content="Sumérgete en Finca Oaxaca: descanso natural, experiencias auténticas y una conexión íntima con el entorno."
    />
    <meta
      name="twitter:image"
      content="/src/assets/og-preview.jpg"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Finca Oaxaca",
        "description": "Alojamiento con habitaciones únicas: Caracol, Quetzal, Venado, Iguana, Tortuga y Puma.",
        "image": [
          "/src/assets/caracol.jpg",
          "/src/assets/quetzal.jpg",
          "/src/assets/venado-1.jpg",
          "/src/assets/iguana1.jpg",
          "/src/assets/tortuga.jpg",
          "/src/assets/puma1.jpg"
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "GC-200 KM",
          "addressLocality": "Gran Canaria",
          "addressRegion": "Islas Canarias",
          "addressCountry": "ES"
        },
        "url": "https://fincaoaxaca.com",
        "hasPart": [
          {
            "@type": "HotelRoom",
            "name": "Habitación Caracol",
            "url": "https://fincaoaxaca.com/#caracol",
            "description": "Habitación con materiales naturales y ambiente sereno.",
            "image": "/src/assets/caracol.jpg"
          },
          {
            "@type": "HotelRoom",
            "name": "Habitación Quetzal",
            "url": "https://fincaoaxaca.com/#quetzal",
            "description": "Luz suave, arquitectura natural y recogimiento.",
            "image": "/src/assets/quetzal.jpg"
          },
          {
            "@type": "HotelRoom",
            "name": "Habitación Venado",
            "url": "https://fincaoaxaca.com/#venado",
            "description": "Decoración natural y colores cálidos.",
            "image": "/src/assets/venado-1.jpg"
          },
          {
            "@type": "HotelRoom",
            "name": "Habitación Iguana",
            "url": "https://fincaoaxaca.com/#iguana",
            "description": "Diseño cálido con fibras naturales.",
            "image": "/src/assets/iguana1.jpg"
          },
          {
            "@type": "HotelRoom",
            "name": "Habitación Tortuga",
            "url": "https://fincaoaxaca.com/#tortuga",
            "description": "Refugio de calma con luz natural.",
            "image": "/src/assets/tortuga.jpg",
            "offers": {
              "@type": "Offer",
              "price": "65.00",
              "priceCurrency": "EUR",
              "availability": "https://schema.org/InStock"
            }
          },
          {
            "@type": "HotelRoom",
            "name": "Habitación Puma",
            "url": "https://fincaoaxaca.com/#puma",
            "description": "Ambiente íntimo y confortable.",
            "image": "/src/assets/puma1.jpg"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
